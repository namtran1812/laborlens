[project]
name = "laborlens"
version = "0.1.0"
description = "Autonomous labor-market intelligence and economic research engine"
requires-python = ">=3.11"

dependencies = [
  "httpx>=0.28",
  "openai>=2.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "typer>=0.15",
  "clickhouse-connect>=0.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[project.scripts]
laborlens = "laborlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laborlens"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
